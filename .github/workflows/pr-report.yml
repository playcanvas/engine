name: PR Report

# Builds the PR head and its base in one run and posts two sticky PR comments:
# - API report: a full-signature view of the public API, sourced from TypeDoc's --json model, so it
#   follows the docs' public-API rules (excludeNotDocumented, @ignore, @private, the typedoc plugin)
#   and never reports internal/ignored symbols. The comment is removed when the API is unchanged.
# - Build size: raw / gzip / brotli sizes of the minified bundles (UMD + ESM). Only the min bundles
#   are built (not rel/dbg/prf/types) to keep the run fast.
# There is no stored baseline: the base commit is rebuilt fresh in the same run, so the comparison is
# always "this PR vs the main it targets". Informative only; never fails the build.
#
# Note: comments directly, so on fork PRs (read-only token) the comment steps can't post; they are
# marked continue-on-error so those runs stay green (just without comments).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-report:
    name: PR Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pin the embedded git revision to a constant for both builds; otherwise the differing commit
    # hashes baked into each bundle show up as a phantom (compressed-)size diff even when no code
    # changed. Honoured by utils/rollup-version-revision.mjs.
    env:
      ENGINE_BUILD_REVISION: ci-build-size
    steps:
      - name: Check out PR
        uses: actions/checkout@v7.0.1
        with:
          path: pr
          fetch-depth: 2 # need the merge commit's parents, see below

      - name: Resolve base commit
        id: base
        # First parent of the pull_request merge ref is the base commit this PR was actually merged
        # with. Do not use pull_request.base.sha - that is frozen when the PR is opened and is not
        # advanced on synchronize, so once the base branch moves, everything merged into it since
        # shows up as this PR's own changes.
        run: echo "sha=$(git -C pr rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

      - name: Check out base
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: base

      - name: Set up Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: 26.x

      - name: Build base
        run: |
          cp pr/utils/api-surface.mjs pr/utils/build-size.mjs pr/utils/rollup-version-revision.mjs base/utils/
          cd base
          npm clean-install --progress=false --no-fund
          npx typedoc --json api.json --skipErrorChecking
          node utils/api-surface.mjs api.json > surface.txt
          npm run build:min:umd
          npm run build:min:esm
          node utils/build-size.mjs > sizes.json

      - name: Build PR
        run: |
          cd pr
          npm clean-install --progress=false --no-fund
          npx typedoc --json api.json --skipErrorChecking
          node utils/api-surface.mjs api.json > surface.txt
          npm run build:min:umd
          npm run build:min:esm
          node utils/build-size.mjs > sizes.json

      - name: Diff API surfaces
        run: git --no-pager diff --no-index -U0 -- base/surface.txt pr/surface.txt > api-diff.txt || true

      - name: Comment API report
        continue-on-error: true # fork PRs get a read-only token; don't fail the run if commenting is denied
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- api-report-bot -->';
            const prNumber = context.payload.pull_request.number;

            const raw = fs.existsSync('api-diff.txt') ? fs.readFileSync('api-diff.txt', 'utf8') : '';
            // each surface line is fully-qualified, so keep only +/- lines (drop diff/@@ headers)
            const lines = raw.split('\n').filter(l => /^[+-]/.test(l) && !/^(\+\+\+|---)/.test(l));
            const adds = lines.filter(l => l.startsWith('+')).length;
            const dels = lines.filter(l => l.startsWith('-')).length;

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (!lines.length) {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            // ~~~ fence (not ```), so backticks in PR-controlled content can't break out
            let diff = lines.join('\n');
            const LIMIT = 60000;
            const note = diff.length > LIMIT ? '\n… (diff truncated)' : '';
            if (note) diff = diff.slice(0, LIMIT);
            const body = `${MARKER}\n### Public API report\n\n`
              + `This PR changes the public API surface (**+${adds} / −${dels}**), per the docs' rules `
              + `(@ignore / @private / undocumented are excluded).\n\n`
              + `<details><summary>Show API diff</summary>\n\n~~~diff\n${diff}${note}\n~~~\n\n</details>\n\n`
              + `_Informational only — this never fails the build._`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

      - name: Comment build size
        continue-on-error: true # fork PRs get a read-only token; don't fail the run if commenting is denied
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- build-size-bot -->';
            const prNumber = context.payload.pull_request.number;

            const read = p => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : {};
            const base = read('base/sizes.json');
            const pr = read('pr/sizes.json');

            const kb = n => `${(n / 1024).toFixed(1)} KB`;
            const delta = n => {
              if (n < 1024) return `${n} B`;
              if (n < 1024 * 1024) return kb(n);
              return `${(n / (1024 * 1024)).toFixed(1)} MB`;
            };
            const cell = (b, p) => {
              const d = p - b;
              if (!b) return `${kb(p)} (new)`;
              if (!d) return `${kb(p)} —`;
              const sign = d > 0 ? '+' : '−';
              const pct = (Math.abs(d) / b * 100).toFixed(2);
              return `${kb(p)} (${sign}${delta(Math.abs(d))}, ${sign}${pct}%)`;
            };

            const bundles = [...new Set([...Object.keys(base), ...Object.keys(pr)])].sort();
            const changed = bundles.some(name =>
              ['raw', 'gzip', 'brotli'].some(m => (base[name]?.[m] ?? 0) !== (pr[name]?.[m] ?? 0)));

            const rows = bundles.map((name) => {
              const b = base[name] || {}, p = pr[name] || {};
              return `| \`${name}\` | ${cell(b.raw, p.raw)} | ${cell(b.gzip, p.gzip)} | ${cell(b.brotli, p.brotli)} |`;
            });

            const headline = changed
              ? 'This PR changes the size of the minified bundles.'
              : 'This PR does not change the size of the minified bundles.';
            const body = `${MARKER}\n### Build size report\n\n`
              + `${headline}\n\n`
              + `| Bundle | Minified | Gzip | Brotli |\n`
              + `| --- | --- | --- | --- |\n`
              + `${rows.join('\n')}\n`;

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
